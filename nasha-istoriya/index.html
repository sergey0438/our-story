<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14060b">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Маленькая история о нас">
  <title>Для тебя ❤️</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600&family=Marck+Script&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="game">
  <div class="sky" aria-hidden="true">
    <div class="glow glow--a"></div>
    <div class="glow glow--b"></div>
    <div class="hearts" id="floatingHearts"></div>
  </div>
  <div class="veil" id="veil" aria-hidden="true"></div>

  <header class="topbar" id="topbar" hidden>
    <button class="icon-btn" id="soundBtn" type="button" aria-label="Включить музыку" hidden>
      <span class="icon-btn__on" aria-hidden="true">♫</span>
    </button>
  </header>

  <main class="stage" id="stage" aria-live="polite">
    <section class="screen screen--center is-active" id="loading">
      <div class="loader" role="status">
        <span class="loader__heart" aria-hidden="true">❤</span>
        <p class="loader__text">Готовлю кое-что особенное…</p>
      </div>
    </section>
  </main>

  <div class="fx" id="fx" aria-hidden="true"></div>
  <div class="preview-badge" id="previewBadge" hidden>Предпросмотр черновика · ответы не смешиваются с настоящими</div>

  <noscript>
    <p class="noscript">Чтобы открыть эту историю, включи, пожалуйста, JavaScript ❤️</p>
  </noscript>

  <script src="js/config.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
